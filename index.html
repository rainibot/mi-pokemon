<script>
    lucide.createIcons();
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playRetroSound(type) {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        if (type === 'shiny') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1046.50, now);
            osc.frequency.exponentialRampToValueAtTime(2637.02, now + 0.25);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        } else {
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.15);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        }
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
    }

    function createSparkles() {
        const container = document.getElementById('sparkle-container');
        container.innerHTML = '';
        for (let i = 0; i < 10; i++) {
            const p = document.createElement('div');
            p.className = 'sparkle-particle';
            p.style.width = '10px'; p.style.height = '10px';
            p.style.left = '50%'; p.style.top = '50%';
            const angle = (i / 10) * 2 * Math.PI;
            p.style.setProperty('--tx', `${Math.cos(angle) * 50}px`);
            p.style.setProperty('--ty', `${Math.sin(angle) * 50}px`);
            container.appendChild(p);
        }
    }

    // --- CONFIGURACIÓN DE SUPABASE ---
    const SUPABASE_URL = 'https://kwscsikpzmlyemjaaqje.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3c2NzaWtwem1seWVtamFhcWplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDA4NzgsImV4cCI6MjEwNzkxNjg3OH0.LP7eLnDNI2KRFgmWnM2JCNY2FQM1KrzfayGF0cSvdVE';
    const NOMBRE_TABLA = 'pokemon_capturados'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Función auxiliar para obtener datos del Pokémon desde la PokéAPI usando su ID
    async function obtenerDatosPokemon(pokemonId, esShiny) {
        try {
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
            const data = await res.json();
            return {
                nombre: data.name.toUpperCase(),
                imagen: esShiny 
                    ? (data.sprites.front_shiny || data.sprites.front_default) 
                    : data.sprites.front_default
            };
        } catch (e) {
            return { nombre: `POKÉMON #${pokemonId}`, imagen: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemonId}.png` };
        }
    }

    // 1. ESCUCHAR CAPTURAS EN TIEMPO REAL (OBS)
    _supabase
        .channel('cambios-capturas')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: NOMBRE_TABLA }, async payload => {
            const c = payload.new;
            const info = await obtenerDatosPokemon(c.pokemon_id, c.es_shiny);
            
            const spriteImg = document.getElementById('pokemon-sprite');
            const nameEl = document.getElementById('pokemon-name');
            const typeEl = document.getElementById('pokemon-type');
            const dialogEl = document.getElementById('dialog-text');
            const screen = document.getElementById('screen-display');
            const shinyStatus = document.getElementById('shiny-status');
            const flash = document.getElementById('flash-overlay');

            spriteImg.src = info.imagen;
            nameEl.textContent = info.nombre;
            typeEl.textContent = `#${String(c.pokemon_id).padStart(3, '0')} - Nvl ${c.nivel || 1}`;
            
            if (c.es_shiny) {
                screen.style.backgroundColor = '#f8f870';
                shinyStatus.textContent = "✨ SHINY!";
                flash.classList.add('shiny-flash');
                setTimeout(() => flash.classList.remove('shiny-flash'), 600);
                playRetroSound('shiny');
                createSparkles();
                dialogEl.textContent = `¡@${c.username} atrapó a un ${info.nombre} Shiny!`;
            } else {
                screen.style.backgroundColor = '#8bac0f';
                shinyStatus.textContent = "NORMAL";
                document.getElementById('sparkle-container').innerHTML = '';
                playRetroSound('normal');
                dialogEl.textContent = `¡@${c.username} atrapó a ${info.nombre}!`;
            }
        })
        .subscribe();

    // 2. CONSULTAR EL CATÁLOGO PERSONAL USANDO 'username'
    async function consultarCatalogoUsuario(nombreUsuario) {
        const contenedorCatalogo = document.getElementById('contenedor-catalogo');
        contenedorCatalogo.innerHTML = '<p class="text-[8px] col-span-4 text-center py-4">Buscando capturas...</p>';

        const { data, error } = await _supabase
            .from(NOMBRE_TABLA)
            .select('*')
            .eq('username', nombreUsuario) // <--- Tu columna real en la base de datos
            .order('id', { ascending: false });

        if (error) {
            console.error("Error al consultar:", error);
            contenedorCatalogo.innerHTML = '<p class="text-[8px] col-span-4 text-center text-red-600 py-4">Error al cargar datos.</p>';
            return;
        }

        contenedorCatalogo.innerHTML = '';

        if (data.length === 0) {
            contenedorCatalogo.innerHTML = '<p class="text-[8px] col-span-4 text-center py-4">Aún no tienes Pokémon capturados.</p>';
            return;
        }

        // Recorrer cada captura y pintarla armando su imagen con su ID
        for (let captura of data) {
            const info = await obtenerDatosPokemon(captura.pokemon_id, captura.es_shiny);
            
            const tarjeta = document.createElement('div');
            tarjeta.className = "bg-white border-2 border-black p-2 flex flex-col items-center justify-center";
            tarjeta.innerHTML = `
                <img src="${info.imagen}" alt="${info.nombre}" class="w-12 h-12 object-contain">
                <span class="text-[7px] font-bold mt-1 text-center">${info.nombre}</span>
                <span class="text-[6px] text-gray-600">Nvl ${captura.nivel || 1}</span>
                <span class="text-[6px] ${captura.es_shiny ? 'text-amber-600 font-bold' : 'text-gray-500'}">${captura.es_shiny ? '✨ SHINY' : 'Normal'}</span>
            `;
            contenedorCatalogo.appendChild(tarjeta);
        }
    }

    // Evento del botón de búsqueda
    document.getElementById('btn-consultar').addEventListener('click', () => {
        const nick = document.getElementById('input-usuario').value.trim();
        if (nick) consultarCatalogoUsuario(nick);
    });
</script>
