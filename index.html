cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon GBA SP - Pokédex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { font-family: 'Press Start 2P', monospace; image-rendering: pixelated; user-select: none; }
        body { background-color: #121218; color: #0f380f; }
        .gba-shell { background-color: #d8d8e0; border: 8px solid #90909c; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border-radius: 2rem; }
        .gba-screen-lens { background-color: #2b2b36; border: 4px solid #4a4a58; border-radius: 1rem; }
        .lcd-screen { background-color: #8bac0f; border: 4px solid #0f380f; transition: background-color 0.3s ease; }
        .btn-gba { background: linear-gradient(180deg, #ffe066 0%, #f5a623 60%, #c05800 100%); border: 3px solid #000; box-shadow: 0 4px 0 #602800; cursor: pointer; }
        .btn-gba:active { transform: translateY(3px); box-shadow: 0 1px 0 #602800; }
        .btn-action { background: linear-gradient(180deg, #e0e0e0 0%, #b0b0bc 60%, #70707c 100%); border: 3px solid #000; box-shadow: 0 3px 0 #303038; cursor: pointer; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 1px 0 #303038; }
        .pokemon-card { cursor: pointer; transition: transform 0.1s ease, box-shadow 0.1s ease; }
        .pokemon-card:hover { transform: scale(1.05); box-shadow: 0 0 10px rgba(139, 172, 15, 0.8); }
        .sparkle-particle { position: absolute; pointer-events: none; background-color: #fff; box-shadow: 0 0 6px #fff, 0 0 10px #ffe600; animation: sparkle-anim 0.8s ease-out forwards; clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%); }
        @keyframes sparkle-anim {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(180deg); opacity: 0; }
        }
        @keyframes flash-screen { 0%, 100% { opacity: 0; } 20%, 60% { opacity: 0.8; } 40%, 80% { opacity: 0.3; } }
        .shiny-flash { animation: flash-screen 0.6s ease-in-out; }
        .scanlines::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); background-size: 100% 4px; z-index: 10; pointer-events: none; }
        @keyframes float-pokemon { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
        .animate-float { animation: float-pokemon 2.5s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 gap-6">

    <!-- OVERLAY TIEMPO REAL / PANTALLA GBA SP -->
    <div class="w-full max-w-md gba-shell p-5 relative">
        <div class="flex justify-between items-center mb-3 px-1 text-[8px] text-[#4a4a58] font-bold">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-red-600 inline-block"></span>
                <span class="tracking-widest">POWER</span>
            </div>
            <span class="tracking-widest">GAME BOY ADVANCE SP</span>
        </div>

        <div class="gba-screen-lens p-3 scanlines relative shadow-inner">
            <div id="screen-display" class="lcd-screen rounded p-3 text-[#0f380f] min-h-[220px] flex flex-col justify-between relative overflow-hidden">
                <div id="flash-overlay" class="absolute inset-0 bg-white pointer-events-none opacity-0 z-20"></div>

                <div class="flex justify-between items-center text-[9px] border-b-2 border-[#0f380f] pb-1">
                    <span>STREAM OVERLAY</span>
                    <span id="shiny-status" class="font-bold">NORMAL</span>
                </div>

                <div class="my-auto flex flex-col items-center justify-center relative py-2">
                    <div class="relative w-28 h-28 flex items-center justify-center">
                        <img id="pokemon-sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pokémon" class="w-24 h-24 object-contain animate-float">
                        <div id="sparkle-container" class="absolute inset-0 pointer-events-none z-30"></div>
                    </div>
                    <div class="mt-1 text-center">
                        <h2 id="pokemon-name" class="text-xs font-bold tracking-wide uppercase">PIKACHU</h2>
                        <p id="pokemon-type" class="text-[7px] opacity-80 mt-0.5">#025 - NVL 1</p>
                    </div>
                </div>

                <div class="bg-[#9bbc0f] border-2 border-[#0f380f] p-2 text-[8px] leading-relaxed min-h-[40px] flex items-center">
                    <p id="dialog-text">Esperando capturas del chat...</p>
                </div>
            </div>
        </div>

        <div class="mt-4 flex gap-2 justify-center">
            <button id="btn-shiny-toggle" class="btn-gba w-2/3 py-3 px-2 text-center text-xs font-bold text-black">
                shiny ✨?
            </button>
            <button id="btn-music-toggle" class="btn-action w-1/3 py-3 px-2 text-center text-[8px] font-bold text-black flex items-center justify-center gap-1">
                🎵 MUSIC OFF
            </button>
        </div>
    </div>

    <!-- POKÉDEX PERSONAL -->
    <div class="w-full max-w-2xl gba-shell p-5 flex flex-col gap-4">
        <h3 class="text-xs font-bold text-center uppercase tracking-wider text-[#3a3a46]">Pokédex Personal</h3>
        <div class="flex gap-2 justify-center">
            <input type="text" id="input-usuario" placeholder="Tu usuario de Twitch..." class="p-2 border-2 border-[#4a4a58] text-[9px] bg-white w-2/3 rounded-lg">
            <button id="btn-consultar" class="btn-action px-4 py-2 text-[9px] font-bold rounded-lg text-black">Buscar</button>
        </div>

        <div id="contenedor-catalogo" class="flex flex-col gap-4 max-h-[500px] overflow-y-auto p-2 bg-[#2b2b36] rounded-xl border-4 border-[#4a4a58]">
            <p class="text-[8px] text-white text-center py-8">Ingresa tu nick arriba y pulsa Buscar.</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kwscsikpzmlyemjaaqje.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3c2NzaWtwem1seWVtamFhcWplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDA4NzgsImV4cCI6MjEwNzkxNjg3OH0.LP7eLnDNI2KRFgmWnM2JCNY2FQM1KrzfayGF0cSvdVE';
        const NOMBRE_TABLA = 'pokemon_capturados';

        let _supabase;
        try {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            console.error("Error al cargar Supabase:", e);
        }

        const GENERACIONES = [
            { nombre: "Gen 1 (Kanto)", min: 1, max: 151 },
            { nombre: "Gen 2 (Johto)", min: 152, max: 251 },
            { nombre: "Gen 3 (Hoenn)", min: 252, max: 386 },
            { nombre: "Gen 4 (Sinnoh)", min: 387, max: 493 },
            { nombre: "Gen 5 (Unova)", min: 494, max: 649 },
            { nombre: "Gen 6 (Kalos)", min: 650, max: 721 },
            { nombre: "Gen 7 (Alola)", min: 722, max: 809 },
            { nombre: "Gen 8 (Galar)", min: 810, max: 905 },
            { nombre: "Gen 9 (Paldea)", min: 906, max: 1025 }
        ];

        let pokemonActualDisplay = {
            id: 25,
            nombre: "PIKACHU",
            nivel: 1,
            esShiny: false,
            usuario: "System"
        };

        function obtenerGeneracion(id) {
            for (let gen of GENERACIONES) {
                if (id >= gen.min && id <= gen.max) return gen.nombre;
            }
            return "Otras Generaciones";
        }

        async function obtenerDatosPokeAPI(pokemonId) {
            try {
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
                const data = await res.json();
                return {
                    nombre: data.name.toUpperCase(),
                    normalSprite: data.sprites.front_default,
                    shinySprite: data.sprites.front_shiny || data.sprites.front_default
                };
            } catch (e) {
                return {
                    nombre: `POKÉMON #${pokemonId}`,
                    normalSprite: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemonId}.png`,
                    shinySprite: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${pokemonId}.png`
                };
            }
        }

        function crearChispas() {
            const container = document.getElementById('sparkle-container');
            container.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const p = document.createElement('div');
                p.className = 'sparkle-particle';
                p.style.width = '10px'; p.style.height = '10px';
                p.style.left = '50%'; p.style.top = '50%';
                const angle = (i / 10) * 2 * Math.PI;
                p.style.setProperty('--tx', `${Math.cos(angle) * 50}px`);
                p.style.setProperty('--ty', `${Math.sin(angle) * 50}px`);
                container.appendChild(p);
            }
        }

        async function renderizarEnPantalla(pokemonId, nivel, esShiny, usuario, dialogCustom = null) {
            const apiData = await obtenerDatosPokeAPI(pokemonId);
            
            pokemonActualDisplay = {
                id: pokemonId,
                nombre: apiData.nombre,
                nivel: nivel || 1,
                esShiny: esShiny,
                usuario: usuario,
                normalSprite: apiData.normalSprite,
                shinySprite: apiData.shinySprite
            };

            const spriteImg = document.getElementById('pokemon-sprite');
            const nameEl = document.getElementById('pokemon-name');
            const typeEl = document.getElementById('pokemon-type');
            const dialogEl = document.getElementById('dialog-text');
            const screen = document.getElementById('screen-display');
            const shinyStatus = document.getElementById('shiny-status');

            spriteImg.src = esShiny ? apiData.shinySprite : apiData.normalSprite;
            nameEl.textContent = apiData.nombre;
            typeEl.textContent = `#${String(pokemonId).padStart(3, '0')} - NVL ${nivel || 1}`;

            if (esShiny) {
                screen.style.backgroundColor = '#f8f870';
                shinyStatus.textContent = "✨ SHINY!";
                crearChispas();
            } else {
                screen.style.backgroundColor = '#8bac0f';
                shinyStatus.textContent = "NORMAL";
                document.getElementById('sparkle-container').innerHTML = '';
            }

            if (dialogCustom) {
                dialogEl.textContent = dialogCustom;
            } else {
                dialogEl.textContent = `Viendo el ${apiData.nombre} de @${usuario}`;
            }
        }

        _supabase
            .channel('cambios-capturas')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: NOMBRE_TABLA }, async payload => {
                const c = payload.new;
                const flash = document.getElementById('flash-overlay');

                if (c.es_shiny) {
                    flash.classList.add('shiny-flash');
                    setTimeout(() => flash.classList.remove('shiny-flash'), 600);
                }

                const msg = c.es_shiny 
                    ? `¡@${c.username} atrapó a un ${c.pokemon_id} Shiny!` 
                    : `¡@${c.username} atrapó a un Pokémon!`;

                await renderizarEnPantalla(c.pokemon_id, c.nivel, c.es_shiny, c.username, msg);
            })
            .subscribe();

        async function consultarCatalogoUsuario(nombreUsuario) {
            const contenedor = document.getElementById('contenedor-catalogo');
            contenedor.innerHTML = '<p class="text-[8px] text-white text-center py-8">Cargando Pokédex...</p>';

            try {
                const { data, error } = await _supabase
                    .from(NOMBRE_TABLA)
                    .select('*')
                    .ilike('username', nombreUsuario);

                if (error) {
                    contenedor.innerHTML = `<p class="text-[8px] text-red-400 text-center py-8">Error: ${error.message}</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    contenedor.innerHTML = '<p class="text-[8px] text-white text-center py-8">No se encontraron Pokémon para este usuario.</p>';
                    return;
                }

                contenedor.innerHTML = '';
                data.sort((a, b) => a.pokemon_id - b.pokemon_id);

                const grupos = {};
                for (let c of data) {
                    const gen = obtenerGeneracion(c.pokemon_id);
                    if (!grupos[gen]) grupos[gen] = [];
                    grupos[gen].push(c);
                }

                for (let [genName, lista] of Object.entries(grupos)) {
                    const divGen = document.createElement('div');
                    divGen.className = "flex flex-col gap-2 mb-2";
                    
                    const gridCards = document.createElement('div');
                    gridCards.className = "grid grid-cols-4 sm:grid-cols-5 gap-2";

                    for (let p of lista) {
                        const img = p.es_shiny 
                            ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${p.pokemon_id}.png`
                            : `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.pokemon_id}.png`;

                        const card = document.createElement('div');
                        card.className = "bg-[#8bac0f] border-2 border-[#0f380f] p-2 flex flex-col items-center justify-between rounded pokemon-card shadow";
                        
                        card.innerHTML = `
                            <span class="text-[6px] text-[#0f380f] font-bold self-start">#${String(p.pokemon_id).padStart(3, '0')}</span>
                            <img src="${img}" class="w-12 h-12 object-contain my-1 pointer-events-none">
                            <span class="text-[5px] text-[#204000] pointer-events-none">Nvl ${p.nivel || 1}</span>
                            <span class="text-[5px] ${p.es_shiny ? 'text-amber-900 font-bold' : 'text-[#0f380f]'} pointer-events-none">
                                ${p.es_shiny ? '✨ SHINY' : 'Normal'}
                            </span>
                        `;

                        card.addEventListener('click', () => {
                            renderizarEnPantalla(p.pokemon_id, p.nivel, p.es_shiny, p.username);
                        });

                        gridCards.appendChild(card);
                    }

                    divGen.innerHTML = `<h4 class="text-[8px] text-[#b8b8d0] border-b border-[#4a4a58] pb-1 uppercase font-bold">${genName}</h4>`;
                    divGen.appendChild(gridCards);
                    contenedor.appendChild(divGen);
                }
            } catch (err) {
                contenedor.innerHTML = `<p class="text-[8px] text-red-400 text-center py-8">Error: ${err.message}</p>`;
            }
        }

        document.getElementById('btn-consultar').addEventListener('click', () => {
            const nick = document.getElementById('input-usuario').value.trim();
            if (nick) consultarCatalogoUsuario(nick);
        });

        document.getElementById('input-usuario').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const nick = document.getElementById('input-usuario').value.trim();
                if (nick) consultarCatalogoUsuario(nick);
            }
        });

        document.getElementById('btn-shiny-toggle').addEventListener('click', () => {
            pokemonActualDisplay.esShiny = !pokemonActualDisplay.esShiny;
            renderizarEnPantalla(
                pokemonActualDisplay.id,
                pokemonActualDisplay.nivel,
                pokemonActualDisplay.esShiny,
                pokemonActualDisplay.usuario
            );
        });

        // REPRODUCTOR DE MÚSICA CORREGIDO
        let bgAudio = new Audio('https://ia800902.us.archive.org/27/items/tv-theme-song-pokemon/Pokemon%20Theme.mp3');
        bgAudio.loop = true;
        bgAudio.volume = 0.25;
        let musicPlaying = false;

        const musicBtn = document.getElementById('btn-music-toggle');
        musicBtn.addEventListener('click', () => {
            if (!musicPlaying) {
                bgAudio.play().then(() => {
                    musicPlaying = true;
                    musicBtn.textContent = "🎵 MUSIC ON";
                    musicBtn.style.background = "linear-gradient(180deg, #85e085 0%, #47d147 60%, #29a329 100%)";
                }).catch(err => {
                    console.error("Bloqueo de audio:", err);
                    alert("Por favor haz clic en cualquier parte vacía de la página primero e intenta de nuevo.");
                });
            } else {
                bgAudio.pause();
                musicPlaying = false;
                musicBtn.textContent = "🎵 MUSIC OFF";
                musicBtn.style.background = "";
            }
        });
    </script>
</body>
</html>
EOF
