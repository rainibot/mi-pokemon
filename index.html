<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon GBA SP - Pokédex y Sistema de Almacenamiento</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Pixel retro 'Press Start 2P' -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { font-family: 'Press Start 2P', monospace; image-rendering: pixelated; user-select: none; }
        
        /* FONDO GENERAL PIXEL ART DE LAPRAS NAVEGANDO EN EL MAR */
        body { 
            background-color: #40a0e0;
            background-image: url('https://i.pinimg.com/736x/5c/4b/31/5c4b31336423985a1ef4c2b74050d53c.jpg');
            background-repeat: no-repeat;
            background-position: center bottom;
            background-size: cover;
            background-attachment: fixed;
            color: #0f380f; 
        }

        /* ESTRUCTURA INDEPENDIENTE ESTILO CARCASA GBA SP */
        .gba-shell { 
            background-color: rgba(216, 216, 224, 0.95); 
            border: 8px solid #90909c; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 4px 6px rgba(255,255,255,0.6); 
            border-radius: 2rem; 
            backdrop-filter: blur(2px);
        }

        .btn-gba { background: linear-gradient(180deg, #ffe066 0%, #f5a623 60%, #c05800 100%); border: 3px solid #000; box-shadow: 0 4px 0 #602800; cursor: pointer; }
        .btn-gba:active { transform: translateY(3px); box-shadow: 0 1px 0 #602800; }
        .btn-action { background: linear-gradient(180deg, #e0e0e0 0%, #b0b0bc 60%, #70707c 100%); border: 3px solid #000; box-shadow: 0 3px 0 #303038; cursor: pointer; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 1px 0 #303038; }

        /* ESTILOS INTERIORES DE CAJA Y PANEL DE INFO */
        .pc-info-panel {
            background-color: #3b3c4a;
            border: 6px solid #202028;
            border-radius: 1rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .pc-box-container {
            background-color: #3b3c4a;
            border: 6px solid #202028;
            border-radius: 1rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .pc-preview-box {
            background-color: #e0f2fe;
            background-image: 
                radial-gradient(#bae6fd 20%, transparent 20%),
                radial-gradient(#bae6fd 20%, transparent 20%);
            background-position: 0 0, 8px 8px;
            background-size: 16px 16px;
            border: 4px solid #1e3a8a;
            border-radius: 0.5rem;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.2);
        }

        .pc-box-wallpaper {
            background-color: #a8d058;
            background-image: 
                linear-gradient(to right, #90b840 1px, transparent 1px),
                linear-gradient(to bottom, #90b840 1px, transparent 1px);
            background-size: 24px 24px;
            border: 5px solid #d8b030;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.3), 0 0 0 3px #886018;
            border-radius: 0.25rem;
        }

        .pc-header-banner {
            background: linear-gradient(180deg, #ffffff 0%, #e0e0e8 100%);
            border: 3px solid #888898;
            box-shadow: 0 2px 0 #484858;
            color: #282830;
        }

        /* CASILLA AMPLIADA DE 3 COLUMNAS */
        .pokemon-icon-slot {
            width: 100px;
            height: 100px;
            position: relative;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        .pokemon-icon-slot.captured {
            cursor: pointer;
            background: rgba(255, 255, 255, 0.4);
        }

        .pokemon-icon-slot.captured:hover {
            transform: scale(1.08);
            z-index: 20;
            background: rgba(255, 255, 255, 0.6);
            border-color: #f8d030;
        }

        /* SILUETA TENUE CON EFECTO DE SOMBRA RETRO */
        .silhouette-img {
            filter: grayscale(100%);
            opacity: 0.22;
        }

        .sparkle-particle { position: absolute; pointer-events: none; background-color: #fff; box-shadow: 0 0 6px #fff, 0 0 10px #ffe600; animation: sparkle-anim 0.8s ease-out forwards; clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%); }
        @keyframes sparkle-anim {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(180deg); opacity: 0; }
        }

        @keyframes float-pokemon { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
        .animate-float { animation: float-pokemon 2.5s ease-in-out infinite; }

        /* Scrollbar personalizado */
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1a1a22; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #d8b030; border: 1px solid #886018; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #f5a623; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="w-full max-w-6xl flex flex-col gap-4 my-auto">
        
        <!-- BARRA SUPERIOR INDEPENDIENTE DE BÚSQUEDA Y CONSULTA -->
        <div class="gba-shell p-3 sm:p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <i data-lucide="monitor" class="w-5 h-5 text-[#1e3a8a]"></i>
                <span class="text-[9px] text-[#202028] tracking-widest uppercase font-bold">POKÉDEX NACIONAL DE REGIONES</span>
            </div>

            <div class="flex gap-2 w-full sm:w-auto">
                <input type="text" id="input-usuario" placeholder="Nick de Twitch..." class="p-2 text-[9px] bg-white text-black border-2 border-[#70707c] rounded focus:outline-none w-full sm:w-60">
                <button id="btn-consultar" class="btn-action px-4 py-2 text-[9px] font-bold rounded text-black shrink-0">BUSCAR</button>
            </div>
        </div>

        <!-- SECCIÓN DE LOS 2 CUADROS INDEPENDIENTES (INFO Y CAJA DE PC) -->
        <div class="flex flex-col lg:flex-row gap-6 items-stretch justify-center">
            
            <!-- CUADRO 1: INFO PKMN (IZQUIERDA) -->
            <div class="w-full lg:w-96 gba-shell p-4 flex flex-col justify-between shrink-0">
                <div class="pc-info-panel p-4 flex flex-col justify-between h-full">
                    <div>
                        <!-- Encabezado INFO PKMN -->
                        <div class="bg-[#282830] border-2 border-[#181820] px-2 py-1.5 text-center mb-3 rounded">
                            <span class="text-[9px] text-[#f8d030] font-bold tracking-widest">— INFO PKMN —</span>
                        </div>

                        <!-- Cuadro con fondo azul claro y modelo 3D -->
                        <div class="pc-preview-box h-52 flex items-center justify-center relative p-2 mb-3">
                            <img id="pokemon-sprite" src="https://play.pokemonshowdown.com/sprites/xyani/pikachu.gif" alt="Pokémon 3D" class="w-36 h-36 object-contain animate-float drop-shadow-md">
                            <div id="sparkle-container" class="absolute inset-0 pointer-events-none z-30"></div>
                        </div>

                        <!-- Datos del Pokémon seleccionado -->
                        <div class="bg-[#282830] border-2 border-[#181820] p-3 rounded text-white flex flex-col gap-1.5">
                            <div class="flex justify-between items-center">
                                <h2 id="pokemon-name" class="text-[10px] font-bold text-[#f8f8f8] uppercase tracking-wider">PIKACHU</h2>
                                <span id="shiny-status" class="text-[7px] text-[#888898] font-bold">NORMAL</span>
                            </div>
                            <p id="pokemon-id-display" class="text-[8px] text-[#a0a0b0]">/#025</p>
                            <div class="flex justify-between items-center text-[8px] mt-1 pt-1 border-t border-[#404048]">
                                <span id="pokemon-owner" class="text-[#88c0f0]">@System</span>
                                <span id="pokemon-level" class="text-[#f8d030]">Nv.1</span>
                            </div>
                        </div>
                    </div>

                    <!-- Botones de Acción dentro del cuadro INFO -->
                    <div class="mt-4 flex flex-col gap-2">
                        <button id="btn-shiny-toggle" class="btn-gba w-full py-3 px-2 rounded-lg text-center text-[8px] font-bold tracking-wider text-black">
                            shiny ✨?
                        </button>
                        
                        <button id="sound-toggle" class="btn-action w-full py-2.5 px-2 rounded-lg text-[7px] font-bold flex items-center justify-center gap-2 text-black">
                            <i data-lucide="volume-x" class="w-3.5 h-3.5" id="sound-icon"></i>
                            <span id="sound-text">AUDIO OFF</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- CUADRO 2: CAJA POKÉMON (DERECHA - FILAS DE 3 COLUMNAS) -->
            <div class="w-full gba-shell p-4 flex flex-col justify-between grow">
                <div class="pc-box-container p-4 flex flex-col justify-between h-full gap-3">
                    
                    <!-- Cabecera de Navegación por Regiones -->
                    <div class="pc-header-banner p-2 rounded flex items-center justify-between text-[8px] font-bold">
                        <button id="btn-prev-gen" class="px-2 py-1 text-[#3b3c4a] hover:bg-[#c8c8d0] rounded border border-[#70707c]">◀ ANTERIOR</button>
                        <span id="box-title" class="tracking-widest uppercase text-center text-[9px] text-[#1e3a8a]">KANTO (GEN 1)</span>
                        <button id="btn-next-gen" class="px-2 py-1 text-[#3b3c4a] hover:bg-[#c8c8d0] rounded border border-[#70707c]">SIGUIENTE ▶</button>
                    </div>

                    <!-- TAPETE VERDE CON CUADRÍCULA FIJA DE 3 POKÉMON POR FILA -->
                    <div class="pc-box-wallpaper h-[410px] p-4 custom-scroll overflow-y-auto">
                        <div id="contenedor-catalogo" class="grid grid-cols-3 gap-3 sm:gap-4 justify-items-center items-center">
                            <p class="col-span-full text-[8px] text-[#282830] text-center py-24 font-bold">
                                Ingresa tu nick arriba y pulsa Buscar para consultar tu Pokédex.
                            </p>
                        </div>
                    </div>

                    <div class="flex justify-between items-center text-[7px] text-[#a0a0b0] px-1">
                        <span id="region-progress-text">DESBLOQUEADOS: 0/151</span>
                        <span>SELECCIONAR: VER INFO</span>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        lucide.createIcons();

        // CONTEXTO DE AUDIO CHIPTUNE RETRO
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let musicPlaying = false;
        let musicTimer = null;
        let currentStep = 0;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playRetroSound(type) {
            initAudio();
            const now = audioCtx.currentTime;

            if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'shiny') {
                const notes = [1046.50, 1318.51, 1567.98, 2093.00, 2637.02];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + (idx * 0.06));
                    gain.gain.setValueAtTime(0, now + (idx * 0.06));
                    gain.gain.linearRampToValueAtTime(0.12, now + (idx * 0.06) + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.06) + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + (idx * 0.06));
                    osc.stop(now + (idx * 0.06) + 0.25);
                });
            } else if (type === 'normal') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(330, now);
                osc.frequency.linearRampToValueAtTime(165, now + 0.2);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // MÚSICA RELAJANTE DE FONDO
        const FREQS = { C4: 261.63, E4: 329.63, G4: 392.00, B4: 493.88, C5: 523.25, E5: 659.25, G5: 783.99, REST: 0 };
        const MELODIA_RELAJANTE = [
            'C4', 'G4', 'E5', 'C5', 'G4', 'E4', 'C4', 'REST',
            'B4', 'G4', 'D5', 'B4', 'G4', 'D4', 'B4', 'REST',
            'A4', 'E5', 'C5', 'A4', 'E4', 'C4', 'A4', 'REST',
            'G4', 'D5', 'B4', 'G4', 'D4', 'G4', 'C5', 'REST'
        ];

        function playRelaxingNote(freq, duration) {
            if (!freq || freq === 0 || !musicPlaying) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.015, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration - 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + duration);
        }

        function stepRelaxingLoop() {
            if (!musicPlaying) return;
            const noteName = MELODIA_RELAJANTE[currentStep];
            playRelaxingNote(FREQS[noteName], 0.45);

            currentStep = (currentStep + 1) % MELODIA_RELAJANTE.length;
            musicTimer = setTimeout(stepRelaxingLoop, 450);
        }

        function startBgMusic() {
            initAudio();
            musicPlaying = true;
            currentStep = 0;
            stepRelaxingLoop();
        }

        function stopBgMusic() {
            musicPlaying = false;
            if (musicTimer) clearTimeout(musicTimer);
        }

        // CONFIGURACIÓN DE SUPABASE
        const SUPABASE_URL = 'https://kwscsikpzmlyemjaaqje.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3c2NzaWtwem1seWVtamFhcWplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDA4NzgsImV4cCI6MjEwNzkxNjg3OH0.LP7eLnDNI2KRFgmWnM2JCNY2FQM1KrzfayGF0cSvdVE';
        const NOMBRE_TABLA = 'pokemon_capturados';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // CONFIGURACIÓN DE REGIONES Y RANGOS DE POKÉDEX
        const REGIONES = [
            { nombre: "KANTO (GEN 1)", min: 1, max: 151 },
            { nombre: "JOHTO (GEN 2)", min: 152, max: 251 },
            { nombre: "HOENN (GEN 3)", min: 252, max: 386 },
            { nombre: "SINNOH (GEN 4)", min: 387, max: 493 },
            { nombre: "UNOVA (GEN 5)", min: 494, max: 649 },
            { nombre: "KALOS (GEN 6)", min: 650, max: 721 },
            { nombre: "ALOLA (GEN 7)", min: 722, max: 809 },
            { nombre: "GALAR (GEN 8)", min: 810, max: 905 },
            { nombre: "PALDEA (GEN 9)", min: 906, max: 1025 }
        ];

        let regionActualIndex = 0;
        let capturasUsuarioActual = [];
        let usuarioBuscadoActual = "";

        let pokemonActualDisplay = { id: 25, nombre: "PIKACHU", nivel: 1, esShiny: false, usuario: "System", tieneShinyReal: false };

        async function obtenerDatosPokeAPI(pokemonId) {
            try {
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
                const data = await res.json();
                const nombreLower = data.name.toLowerCase();
                return {
                    nombre: data.name.toUpperCase(),
                    normalSprite: `https://play.pokemonshowdown.com/sprites/xyani/${nombreLower}.gif`,
                    shinySprite: `https://play.pokemonshowdown.com/sprites/xyani-shiny/${nombreLower}.gif`,
                    iconSprite: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemonId}.png`
                };
            } catch (e) {
                return {
                    nombre: `POKÉMON #${pokemonId}`,
                    normalSprite: `https://play.pokemonshowdown.com/sprites/xyani/${pokemonId}.gif`,
                    shinySprite: `https://play.pokemonshowdown.com/sprites/xyani-shiny/${pokemonId}.gif`,
                    iconSprite: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemonId}.png`
                };
            }
        }

        function crearChispas() {
            const container = document.getElementById('sparkle-container');
            container.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const p = document.createElement('div');
                p.className = 'sparkle-particle';
                p.style.width = '10px'; p.style.height = '10px';
                p.style.left = '50%'; p.style.top = '50%';
                const angle = (i / 10) * 2 * Math.PI;
                p.style.setProperty('--tx', `${Math.cos(angle) * 60}px`);
                p.style.setProperty('--ty', `${Math.sin(angle) * 60}px`);
                container.appendChild(p);
            }
        }

        async function renderizarEnPantalla(pokemonId, nivel, mostrarShiny, usuario, tieneShiny = false) {
            const apiData = await obtenerDatosPokeAPI(pokemonId);
            
            const esShinyFinal = tieneShiny && mostrarShiny;

            pokemonActualDisplay = {
                id: pokemonId,
                nombre: apiData.nombre,
                nivel: nivel || 1,
                esShiny: esShinyFinal,
                usuario: usuario,
                tieneShinyReal: tieneShiny,
                normalSprite: apiData.normalSprite,
                shinySprite: apiData.shinySprite
            };

            const spriteImg = document.getElementById('pokemon-sprite');
            const nameEl = document.getElementById('pokemon-name');
            const idEl = document.getElementById('pokemon-id-display');
            const ownerEl = document.getElementById('pokemon-owner');
            const levelEl = document.getElementById('pokemon-level');
            const shinyStatus = document.getElementById('shiny-status');

            spriteImg.src = esShinyFinal ? apiData.shinySprite : apiData.normalSprite;
            nameEl.textContent = apiData.nombre;
            idEl.textContent = `/#${String(pokemonId).padStart(3, '0')}`;
            ownerEl.textContent = `@${usuario}`;
            levelEl.textContent = `Nv.${nivel || 1}`;

            if (esShinyFinal) {
                shinyStatus.textContent = "✨ SHINY";
                shinyStatus.className = "text-[7px] text-[#f8d030] font-bold";
                playRetroSound('shiny');
                crearChispas();
            } else {
                shinyStatus.textContent = "NORMAL";
                shinyStatus.className = "text-[7px] text-[#888898] font-bold";
                playRetroSound('normal');
                document.getElementById('sparkle-container').innerHTML = '';
            }
        }

        // RENDERIZAR LA CAJA SEGÚN LA REGIÓN SELECCIONADA EN FILAS DE 3 POKÉMON
        async function renderizarRegionActual() {
            const region = REGIONES[regionActualIndex];
            const contenedor = document.getElementById('contenedor-catalogo');
            const boxTitle = document.getElementById('box-title');
            const progressText = document.getElementById('region-progress-text');

            boxTitle.textContent = `${region.nombre}`;
            contenedor.innerHTML = '';

            let desbloqueadosRegion = 0;
            const totalRegion = region.max - region.min + 1;

            for (let id = region.min; id <= region.max; id++) {
                const captura = capturasUsuarioActual.find(c => c.pokemon_id === id);
                const loTiene = !!captura;
                if (loTiene) desbloqueadosRegion++;

                const slot = document.createElement('div');
                slot.className = `pokemon-icon-slot flex flex-col items-center justify-center ${loTiene ? 'captured' : ''}`;
                
                const iconUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;

                if (loTiene) {
                    slot.innerHTML = `
                        <span class="absolute top-1 left-1.5 text-[7px] text-[#282830] font-bold">#${id}</span>
                        <img src="${iconUrl}" alt="PKMN #${id}" class="w-16 h-16 object-contain drop-shadow-md">
                        ${captura.es_shiny ? '<span class="absolute top-0.5 right-1 text-[10px]">✨</span>' : ''}
                    `;

                    slot.addEventListener('click', () => {
                        playRetroSound('click');
                        renderizarEnPantalla(captura.pokemon_id, captura.nivel, false, captura.username, captura.es_shiny);
                    });
                } else {
                    // SILUETA TENUE CON SIGNO '?' PARA POKÉMON NO ATRAPADOS
                    slot.innerHTML = `
                        <span class="absolute top-1 left-1.5 text-[7px] text-[#282830] opacity-50 font-bold">#${id}</span>
                        <img src="${iconUrl}" alt="???" class="w-16 h-16 object-contain silhouette-img">
                        <span class="absolute bottom-1 right-1.5 text-[9px] text-[#282830] opacity-60 font-bold">?</span>
                    `;
                }

                contenedor.appendChild(slot);
            }

            progressText.textContent = `DESBLOQUEADOS: ${desbloqueadosRegion}/${totalRegion}`;
        }

        // CONSULTAR SUPABASE POR USUARIO
        async function consultarCatalogoUsuario(nombreUsuario) {
            playRetroSound('click');
            const contenedor = document.getElementById('contenedor-catalogo');
            
            usuarioBuscadoActual = nombreUsuario;
            contenedor.innerHTML = '<p class="col-span-full text-[8px] text-[#282830] text-center py-24 font-bold">Cargando registros de región...</p>';

            try {
                const { data, error } = await _supabase
                    .from(NOMBRE_TABLA)
                    .select('*')
                    .ilike('username', nombreUsuario);

                if (error) {
                    contenedor.innerHTML = `<p class="col-span-full text-[8px] text-red-700 text-center py-24 font-bold">Error: ${error.message}</p>`;
                    return;
                }

                capturasUsuarioActual = data || [];
                renderizarRegionActual();
            } catch (err) {
                contenedor.innerHTML = `<p class="col-span-full text-[8px] text-red-700 text-center py-24 font-bold">Error: ${err.message}</p>`;
            }
        }

        // ESCUCHAR CAPTURAS EN TIEMPO REAL (OBS)
        _supabase
            .channel('cambios-capturas')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: NOMBRE_TABLA }, async payload => {
                const c = payload.new;
                await renderizarEnPantalla(c.pokemon_id, c.nivel, false, c.username, c.es_shiny);
                
                if (usuarioBuscadoActual && c.username.toLowerCase() === usuarioBuscadoActual.toLowerCase()) {
                    capturasUsuarioActual.push(c);
                    renderizarRegionActual();
                }
            })
            .subscribe();

        // NAVEGACIÓN ENTRE REGIONES (ANTERIOR / SIGUIENTE)
        document.getElementById('btn-prev-gen').addEventListener('click', () => {
            playRetroSound('click');
            regionActualIndex = (regionActualIndex - 1 + REGIONES.length) % REGIONES.length;
            renderizarRegionActual();
        });

        document.getElementById('btn-next-gen').addEventListener('click', () => {
            playRetroSound('click');
            regionActualIndex = (regionActualIndex + 1) % REGIONES.length;
            renderizarRegionActual();
        });

        document.getElementById('btn-consultar').addEventListener('click', () => {
            const nick = document.getElementById('input-usuario').value.trim();
            if (nick) consultarCatalogoUsuario(nick);
        });

        document.getElementById('input-usuario').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const nick = document.getElementById('input-usuario').value.trim();
                if (nick) consultarCatalogoUsuario(nick);
            }
        });

        document.getElementById('btn-shiny-toggle').addEventListener('click', () => {
            playRetroSound('click');

            if (!pokemonActualDisplay.tieneShinyReal) {
                alert(`@${pokemonActualDisplay.usuario} no tiene este Pokémon en versión Shiny.`);
                return;
            }

            const nuevoEstadoShiny = !pokemonActualDisplay.esShiny;
            renderizarEnPantalla(
                pokemonActualDisplay.id,
                pokemonActualDisplay.nivel,
                nuevoEstadoShiny,
                pokemonActualDisplay.usuario,
                pokemonActualDisplay.tieneShinyReal
            );
        });

        // CONTROL DE MÚSICA Y AUDIO
        const soundToggle = document.getElementById('sound-toggle');
        const soundText = document.getElementById('sound-text');
        const soundIcon = document.getElementById('sound-icon');

        soundToggle.addEventListener('click', () => {
            if (!musicPlaying) {
                soundText.textContent = 'AUDIO ON';
                soundIcon.setAttribute('data-lucide', 'volume-2');
                startBgMusic();
                playRetroSound('click');
            } else {
                soundText.textContent = 'AUDIO OFF';
                soundIcon.setAttribute('data-lucide', 'volume-x');
                stopBgMusic();
            }
            lucide.createIcons();
        });

        // Cargar un Pokémon aleatorio por defecto
        window.addEventListener('DOMContentLoaded', () => {
            const pokemonClasicos = [25, 6, 9, 3, 143, 94, 131, 133, 150];
            const idAleatorio = pokemonClasicos[Math.floor(Math.random() * pokemonClasicos.length)];
            renderizarEnPantalla(idAleatorio, 1, false, 'System', false);
        });
    </script>
</body>
</html>
